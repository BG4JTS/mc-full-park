name: Deploy Web App

on:
  push:
    branches: ['main']
    paths:
      - 'web/**'
  workflow_dispatch:

env:
  WEB_PORT: 5173

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      
      - name: Build application
        working-directory: ./web
        run: npm run build
      
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/dist
      
      - name: Deploy to hosting
        uses: easingthemes/ssh-deploy@v4
        if: github.ref == 'refs/heads/main'
        needs: build-and-deploy
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /var/www/mc-full-park
          EXCLUDE: '/web/node_modules, /web/.gitignore, /web/src, /web/*.yml, /.github/'
          SCRIPT_AFTER: |
            sudo systemctl restart nginx

  deploy-preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Create preview URL
        run: |
          echo "Preview ready at: https://preview.${{ github.sha }}.example.com"
          # TODO: Add your preview hosting logic here (e.g., Netlify, Vercel)
